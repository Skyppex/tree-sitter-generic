[package]
name = "tree-sitter-generic"
description = "A generic treesitter parser for those files that just don't have a parser"
version = "0.1.0"
authors = ["Brage Ingebrigtsen"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "generic"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/skyppex/tree-sitter-generic"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.1.22"

[dev-dependencies]
tree-sitter = "0.24.7"
